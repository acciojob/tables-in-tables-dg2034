
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Main Table -->
    <table style="width: 100%; height: 100%">
        <tbody>
            <tr>
                <td>
                    <!-- Nested Table 2 -->
                    <table id="nested-table-2">
                        <caption>Nested Table 2</caption>
                        <thead>
                            <tr>
                                <th>Column 1</th>
                                <th>Column 2</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>abc</td>
                                <td>def</td>
                            </tr>
                        </tbody>
                    </table>
                </td>

                <td>
                    <!-- Nested Table 1 -->
                    <h3>Nested Table 1</h3>
                    <table id="nested-table-1">
                        <tbody>
                            <tr>
                                <td>
                                    <ul>
                                        <li>List item 1</li>
                                        <li>List item 2</li>
                                        <li>List item 3</li>
                                    </ul>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>

            <tr>
                <td>
                    <!-- Nested Table 3 -->
                    <h3>Nested Table 3</h3>
                    <table id="nested-table-3">
                        <tbody>
                            <tr>
                                <td>Nested Table</td>
                                <td>Demo Continued</td>
                            </tr>
                        </tbody>
                    </table>
                </td>

                <td>
                    <!-- Nested Table 4 -->
                    <h3>Nested Table 4</h3>
                    <table id="nested-table-4">
                        <tbody>
                            <tr>
                                <td id="html">HTML</td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
